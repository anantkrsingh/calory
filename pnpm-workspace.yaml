packages:
  - "apps/*"
  - "packages/*"

# Prisma downloads its query engine, unrs-resolver builds a native binding.
allowBuilds:
  '@firebase/util': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  msgpackr-extract: true
  prisma: true
  protobufjs: set this to true or false
  unrs-resolver: true
