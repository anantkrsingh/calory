packages:
  - "apps/*"
  - "packages/*"

# Prisma downloads its query engine, unrs-resolver builds a native binding.
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.31.0
  - expo-image-picker@57.0.13
