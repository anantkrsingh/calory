name: EAS Production Build (Android AAB)

on:
  workflow_dispatch: {}

concurrency:
  group: eas-production-aab-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build production AAB (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Scoped to mobile's own dependency graph (config/types/validation) so
      # unrelated workspace packages — notably packages/db's Prisma, whose
      # preinstall script needs Node >=22.5 for node:sqlite — never install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@fitness/mobile..."

      - name: Install EAS CLI
        run: npm install --global eas-cli

      # --local runs the Gradle build on this runner instead of EAS's cloud
      # workers — Android SDK/NDK/JDK all come from the ubuntu-latest image.
      # "production" profile builds an app-bundle (eas.json android.buildType).
      - name: Build production AAB (Android, local)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/build-output/app-release.aab"

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: production-build-android-aab
          path: build-output/app-release.aab
          retention-days: 14
          if-no-files-found: error
