services:
  redis:
    image: redis:7-alpine
    container_name: fitness_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fitness

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fitness_api
    ports:
      - "${API_PORT:-3001}:3000"
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fitness

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: fitness_worker
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fitness

volumes:
  redis_data:

networks:
  fitness:
    name: fitness_network
